services:
  anomaly-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: satellite-anomaly-api:latest
    container_name: satellite-anomaly-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
